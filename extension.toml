id = "github-actions-context"
name = "GitHub Actions (with repository context)"
version = "0.1.0"
schema_version = 1
authors = ["Ezequiel Ramos <ezequiel@sentinelx.com.br>"]
description = "GitHub Actions language server that validates secrets and variables against the repository, organization and job environment."
repository = "https://github.com/digital-divas/zed-github-actions"

[grammars.yaml]
repository = "https://github.com/zed-industries/tree-sitter-yaml"
commit = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"

[language_servers.actions-languageserver]
name = "GitHub Actions Language Server"
languages = ["GitHub Actions"]

[[capabilities]]
kind = "npm:install"
package = "@actions/languageserver"

# token and repository metadata come from the GitHub CLI, the origin remote from git
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["**"]
